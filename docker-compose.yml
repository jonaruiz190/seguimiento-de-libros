services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booktracker
      POSTGRES_USER: booktracker
      POSTGRES_PASSWORD: booktracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booktracker -d booktracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://booktracker:booktracker@database:5432/booktracker
      APP_ORIGIN: http://localhost:3000
      SESSION_DAYS: 7
      TRUST_PROXY: 0
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm start"]

volumes:
  postgres_data:
